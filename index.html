<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DriveSim — Ontario Full G road test driving simulator. A browser-based, Toronto-flavoured practice world with examiner-style coaching." />
    <title>DriveSim · Ontario Full G Trainer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" rel="stylesheet" />
    <style>
      /* Splash shown before the bundle boots */
      html, body { margin: 0; padding: 0; background: #0b0e14; height: 100%; overflow: hidden; }
      #splash {
        position: fixed; inset: 0; display: flex; flex-direction: column; gap: 16px;
        align-items: center; justify-content: center; color: #eef2f8;
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        z-index: 100; transition: opacity 0.5s ease; background: radial-gradient(ellipse at 50% 40%, #16203a 0%, #0b0e14 70%);
      }
      #splash .logo { font-size: 52px; font-weight: 800; letter-spacing: -2.5px; }
      #splash .logo em { font-style: normal; background: linear-gradient(135deg, #7cc0ff, #3a8ef0); -webkit-background-clip: text; background-clip: text; color: transparent; }
      #splash .sub { color: #98a4b8; font-size: 15px; }
      #splash .bar { width: 220px; height: 4px; background: #1d2738; border-radius: 2px; overflow: hidden; }
      #splash .bar i { display: block; height: 100%; width: 40%; background: linear-gradient(90deg, #7cc0ff, #3a8ef0); border-radius: 2px; animation: load 1.1s ease-in-out infinite alternate; }
      @keyframes load { from { transform: translateX(-60%); } to { transform: translateX(420%); } }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="logo">Drive<em>Sim</em></div>
      <div class="sub">Building the city…</div>
      <div class="bar"><i></i></div>
    </div>
    <div id="app"></div>
    <div id="ui"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
