<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DriveSim — Ontario Full G road test driving simulator. A browser-based, Toronto-flavoured practice world with examiner-style coaching." />
    <title>DriveSim · Ontario Full G Trainer</title>
    <style>
      /* Splash shown before the bundle boots */
      html, body { margin: 0; padding: 0; background: #0b0e14; height: 100%; overflow: hidden; }
      #splash {
        position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px;
        align-items: center; justify-content: center; color: #e8edf6;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        z-index: 100; transition: opacity 0.5s ease; background: radial-gradient(ellipse at 50% 40%, #141a26 0%, #0b0e14 70%);
      }
      #splash .logo { font-size: 44px; font-weight: 800; letter-spacing: -1px; }
      #splash .logo em { color: #4da3ff; font-style: normal; }
      #splash .sub { color: #93a1b8; font-size: 15px; }
      #splash .bar { width: 220px; height: 4px; background: #1d2738; border-radius: 2px; overflow: hidden; }
      #splash .bar i { display: block; height: 100%; width: 40%; background: #4da3ff; border-radius: 2px; animation: load 1.1s ease-in-out infinite alternate; }
      @keyframes load { from { transform: translateX(-60%); } to { transform: translateX(420%); } }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="logo">Drive<em>Sim</em></div>
      <div class="sub">Ontario Full G Trainer — loading the city…</div>
      <div class="bar"><i></i></div>
    </div>
    <div id="app"></div>
    <div id="ui"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
