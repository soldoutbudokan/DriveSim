<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fc3ef"/><stop offset="1" stop-color="#c6d8ea"/>
    </linearGradient>
  </defs>
  <rect width="960" height="420" fill="url(#sky)"/>
  <rect y="230" width="960" height="190" fill="#55793f"/>
  <!-- road -->
  <polygon points="330,420 630,420 520,230 440,230" fill="#3d4148"/>
  <polygon points="476,420 484,420 479,230 477,230" fill="#e2b13c"/>
  <line x1="400" y1="420" x2="455" y2="230" stroke="#dfe5ea" stroke-width="3" stroke-dasharray="18 14"/>
  <line x1="560" y1="420" x2="505" y2="230" stroke="#dfe5ea" stroke-width="3" stroke-dasharray="18 14"/>
  <!-- skyline -->
  <g fill="#5d6770">
    <rect x="40" y="120" width="70" height="110"/><rect x="130" y="90" width="60" height="140"/>
    <rect x="700" y="100" width="80" height="130"/><rect x="800" y="140" width="60" height="90"/>
  </g>
  <rect x="205" y="60" width="10" height="170" fill="#b9c0c7"/><ellipse cx="210" cy="105" rx="18" ry="10" fill="#9aa3ad"/>
  <!-- streetcar -->
  <rect x="585" y="250" width="130" height="46" rx="6" fill="#c02434"/>
  <rect x="585" y="246" width="130" height="10" rx="4" fill="#e8e8e6"/>
  <!-- player car -->
  <g>
    <rect x="430" y="320" width="100" height="64" rx="12" fill="#2f6fce"/>
    <rect x="445" y="330" width="70" height="22" rx="6" fill="#16202c"/>
    <rect x="436" y="376" width="16" height="8" rx="3" fill="#ffeeb0"/>
    <rect x="508" y="376" width="16" height="8" rx="3" fill="#ffeeb0"/>
  </g>
  <!-- HUD mock -->
  <rect x="18" y="318" width="220" height="84" rx="14" fill="#0d111a" opacity="0.8"/>
  <text x="44" y="372" font-family="system-ui" font-size="40" font-weight="800" fill="#e8edf6">52</text>
  <text x="46" y="392" font-family="system-ui" font-size="11" fill="#93a1b8">km/h</text>
  <rect x="120" y="334" width="52" height="56" rx="6" fill="#fff" stroke="#111" stroke-width="3"/>
  <text x="146" y="354" font-family="system-ui" font-size="9" font-weight="700" fill="#111" text-anchor="middle">MAXIMUM</text>
  <text x="146" y="380" font-family="system-ui" font-size="22" font-weight="800" fill="#111" text-anchor="middle">50</text>
  <rect x="722" y="318" width="220" height="84" rx="14" fill="#0d111a" opacity="0.8"/>
  <text x="740" y="350" font-family="system-ui" font-size="13" fill="#46d68c">✓ Good blind-spot check.</text>
  <text x="740" y="376" font-family="system-ui" font-size="13" fill="#ffb547">Signal earlier before turning.</text>
  <text x="480" y="36" font-family="system-ui" font-size="17" font-weight="650" fill="#0d111a" text-anchor="middle">At the next lights, turn left onto University Avenue.</text>
</svg>
